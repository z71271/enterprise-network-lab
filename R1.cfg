# ===== R1 出口路由器配置 =====
# 设备: AR2220 | 实际端口: GE0/0/0→ISP-1, GE0/0/1→ISP-2, GE0/0/2→Core-SW

system-view
sysname R1

# --- 接口配置 ---
interface GigabitEthernet0/0/0
 description TO-ISP-1
 ip address 172.16.1.2 255.255.255.252
 quit

interface GigabitEthernet0/0/1
 description TO-ISP-2
 ip address 172.16.2.2 255.255.255.252
 quit

interface GigabitEthernet0/0/2
 description TO-Core-SW
 ip address 10.0.0.1 255.255.255.252
 quit

interface LoopBack0
 ip address 1.1.1.1 255.255.255.255
 quit

# --- OSPF 配置（内部路由协议）---
ospf 1 router-id 1.1.1.1
 area 0.0.0.0
  network 10.0.0.0 0.0.0.3
  network 1.1.1.1 0.0.0.0
 quit

# --- BGP 配置（外部路由协议）---
bgp 65000
 router-id 1.1.1.1
 peer 172.16.1.1 as-number 65001
 peer 172.16.2.1 as-number 65002
 # 宣告内部网段 (华为用反掩码，不用 mask 关键字)
 network 192.168.10.0 255.255.255.0
 network 192.168.20.0 255.255.255.0
 network 192.168.30.0 255.255.255.0
 network 192.168.100.0 255.255.255.0
 quit

# --- 默认路由指向 ISP（主备）---
ip route-static 0.0.0.0 0.0.0.0 172.16.1.1 preference 60
ip route-static 0.0.0.0 0.0.0.0 172.16.2.1 preference 80

# --- ACL + NAT（允许内部上网，访客网 192.168.20.0 不加入）---
acl number 2000
 rule 5 permit source 192.168.10.0 0.0.0.255
 rule 10 permit source 192.168.30.0 0.0.0.255
 rule 15 permit source 192.168.100.0 0.0.0.255
 quit

interface GigabitEthernet0/0/0
 nat outbound 2000
 quit

interface GigabitEthernet0/0/1
 nat outbound 2000
 quit

# --- OSPF 引入默认路由 ---
ospf 1
 default-route-advertise always
 quit

return
