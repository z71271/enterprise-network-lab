# ===== Core-SW 核心交换机配置 =====
# 设备: S5700 | 端口: GE0/0/1→R1, GE0/0/2→AGG-SW-1, GE0/0/3→AGG-SW-2
# Core-SW 是 VLAN 10/20/30/100 的三层网关

system-view
sysname Core-SW

# --- 创建 VLAN ---
vlan batch 10 20 30 100

# --- VLAN 三层接口（网关地址）---
interface Vlanif10
 ip address 192.168.10.254 255.255.255.0
 quit

interface Vlanif20
 ip address 192.168.20.254 255.255.255.0
 quit

interface Vlanif30
 ip address 192.168.30.254 255.255.255.0
 quit

interface Vlanif100
 ip address 192.168.100.254 255.255.255.0
 quit

# --- 上联 R1（三层口）---
interface GigabitEthernet0/0/1
 description TO-R1
 undo portswitch
 ip address 10.0.0.2 255.255.255.252
 quit

# --- 下联汇聚交换机（Trunk 口）---
interface GigabitEthernet0/0/2
 description TO-Agg-SW-1
 port link-type trunk
 port trunk allow-pass vlan 10 20
 quit

interface GigabitEthernet0/0/3
 description TO-Agg-SW-2
 port link-type trunk
 port trunk allow-pass vlan 30 100
 quit

# --- OSPF ---
ospf 1 router-id 10.0.0.2
 area 0.0.0.0
  network 10.0.0.0 0.0.0.3
  network 192.168.10.0 0.0.0.255
  network 192.168.20.0 0.0.0.255
  network 192.168.30.0 0.0.0.255
  network 192.168.100.0 0.0.0.255
 quit

# --- 默认路由指向 R1 ---
ip route-static 0.0.0.0 0.0.0.0 10.0.0.1

# --- AAA 管理 ---
aaa
 local-user admin password cipher admin@123
 local-user admin privilege level 15
 local-user admin service-type telnet ssh
 quit

user-interface vty 0 4
 authentication-mode aaa
 protocol inbound all
 quit

return
